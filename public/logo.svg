<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28303b"/>
      <stop offset="100%" stop-color="#8f98a4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f7f9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d0d4d8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- circular subtle background -->
  <circle cx="512" cy="512" r="480" fill="url(#g1)" opacity="0.12" />

  <!-- roof -->
  <path d="M150 420 L512 180 L874 420 L786 420 L512 260 L238 420 Z" fill="#394149" stroke="#fff" stroke-opacity="0.08" stroke-width="2" filter="url(#s)" />

  <!-- B letter -->
  <g transform="translate(180,360) scale(0.9)" filter="url(#s)">
    <rect x="0" y="0" width="220" height="280" rx="18" fill="url(#g1)" />
    <path d="M40 40 H140 A40 40 0 0 1 140 120 H40 V160 H150 A40 40 0 0 1 150 240 H40 V40 Z" fill="url(#g2)" opacity="0.95" />
  </g>

  <!-- D letter -->
  <g transform="translate(420,360) scale(0.9)" filter="url(#s)">
    <rect x="0" y="0" width="220" height="280" rx="18" fill="url(#g1)" />
    <path d="M40 40 H110 A80 80 0 0 1 110 200 H40 V40 Z" fill="url(#g2)" opacity="0.95" transform="translate(0,0)" />
  </g>

  <!-- text -->
  <text x="512" y="760" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="64" text-anchor="middle" fill="#e6e9eb">BUILDDR AFT</text>
  <text x="512" y="810" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="20" text-anchor="middle" fill="#bfc6cc">Reliable permit drawings for builders</text>
</svg>
